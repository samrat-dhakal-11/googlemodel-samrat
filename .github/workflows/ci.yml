name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" pytest-cov build
      - name: Unit tests + coverage gate (>=90%)
        run: pytest tests/ --cov=googlemodel_samrat --cov-fail-under=90
      - name: py.typed ships in the wheel
        run: |
          python -m build --wheel
          python - <<'PY'
          import zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert any(n.endswith("googlemodel_samrat/py.typed") for n in names), names
          print("py.typed OK in wheel")
          PY
      - run: python3 scripts/verify.py
      - run: python3 scripts/stress_test.py
      - name: Type check (advisory)
        run: |
          pip install mypy
          mypy googlemodel_samrat || echo "::warning::mypy findings (advisory)"
