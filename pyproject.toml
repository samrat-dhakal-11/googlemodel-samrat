[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "googlemodel-samrat"
version = "0.1.4"
description = "Intelligent Gemini API key and model rotation for resilient free-tier usage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Samrat Dhakal" }]
keywords = ["gemini", "langchain", "llm", "rotation", "fallback", "google-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain-google-genai>=4.0.0",
    "python-dotenv>=1.0.0",
    "google-api-core>=2.15.0",
    "langchain-core>=0.1.4",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/samrat-dhakal-11/googlemodel-samrat"
Repository = "https://github.com/samrat-dhakal-11/googlemodel-samrat"
Issues = "https://github.com/samrat-dhakal-11/googlemodel-samrat/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["googlemodel_samrat*"]

[tool.setuptools.package-data]
googlemodel_samrat = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"